[project]
name = "genai-customer-review-analyzer"
version = "0.1.0"
description = "AI-powered customer feedback analysis API with pluggable LLM providers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.117.1",
    "bleach>=6.4.0",
    "fastapi[standard]>=0.139.2",
    "google-genai>=2.12.1",
    "openai>=2.46.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uuid6>=2025.0.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
