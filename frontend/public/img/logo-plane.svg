<svg viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <rect x="0" y="10" width="140" height="140" rx="30" fill="url(#bgGrad2)"/>
  <rect x="6" y="16" width="128" height="128" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Speech bubble -->
  <path d="M28 58
           a17 17 0 0 1 17 -17
           h50
           a17 17 0 0 1 17 17
           v28
           a17 17 0 0 1 -17 17
           h-32
           l-18 17
           v-17
           a17 17 0 0 1 -17 -17
           z"
        fill="#ffffff"/>

  <!-- Star, scaled/translated to sit inside the smaller bubble -->
  <g transform="translate(70,80) scale(0.62) translate(-100,-90)">
    <path d="M100,66 105.9,81.9 122.8,82.6 109.5,93.1 114.1,109.4 100,100
             85.9,109.4 90.5,93.1 77.2,82.6 94.1,81.9 Z"
          fill="url(#starGrad2)"/>
  </g>

  <!-- Sparkle accent -->
  <g transform="translate(70,80) scale(0.62) translate(-100,-90)">
    <path d="M152,34 155.5,44.5 166,48 155.5,51.5 152,62 148.5,51.5 138,48 148.5,44.5 Z"
          fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="168" y="78" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="url(#textGrad)">GenAI</text>
  <text x="168" y="78" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#1F2937" dx="98">Review</text>
  <text x="168" y="118" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#6B7280" letter-spacing="1.5">CUSTOMER FEEDBACK ANALYZER</text>
</svg>