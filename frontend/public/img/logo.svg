<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="200" height="200" rx="42" fill="url(#bgGrad)"/>

  <!-- subtle inner ring for depth -->
  <rect x="8" y="8" width="184" height="184" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Speech bubble (review) -->
  <g filter="url(#soft)">
    <path d="M40 66
             a24 24 0 0 1 24 -24
             h72
             a24 24 0 0 1 24 24
             v40
             a24 24 0 0 1 -24 24
             h-46
             l-26 24
             v-24
             h0
             a24 24 0 0 1 -24 -24
             z"
          fill="#ffffff"/>
  </g>

  <!-- Rating star cut into the bubble -->
  <path d="M100,66 105.9,81.9 122.8,82.6 109.5,93.1 114.1,109.4 100,100
           85.9,109.4 90.5,93.1 77.2,82.6 94.1,81.9 Z"
        fill="url(#starGrad)"/>

  <!-- AI spark accent -->
  <path d="M152,34 155.5,44.5 166,48 155.5,51.5 152,62 148.5,51.5 138,48 148.5,44.5 Z"
        fill="#ffffff"/>
</svg>