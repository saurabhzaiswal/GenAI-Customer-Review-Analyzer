<mat-toolbar class="navbar">
  <div class="navbar__inner">
    <a routerLink="/" class="brand" aria-label="GenAI Customer Review Analyzer home">
      <img src="/img/logo.svg" alt="" width="35" height="35" class="brand__logo" />
      <span class="brand__text">GenAI Customer Review Analyzer</span>
    </a>

    <nav class="nav-links" aria-label="Primary navigation">
      <a mat-button routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon aria-hidden="true">rate_review</mat-icon>
        Reviews
      </a>
      <a mat-button routerLink="/dashboard" routerLinkActive="nav-active">
        <mat-icon aria-hidden="true">insights</mat-icon>
        Dashboard
      </a>
      <a
        mat-stroked-button
        class="github-link"
        href="https://github.com/saurabhzaiswal"
        target="_blank"
        rel="noopener noreferrer"
      >
        <mat-icon aria-hidden="true">code</mat-icon>
        GitHub
      </a>
    </nav>

    <button mat-icon-button class="mobile-menu-toggle" [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation menu">
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #mobileMenu="matMenu">
      <button mat-menu-item routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>rate_review</mat-icon>
        Reviews
      </button>
      <button mat-menu-item routerLink="/dashboard" routerLinkActive="nav-active">
        <mat-icon>insights</mat-icon>
        Dashboard
      </button>
      <a mat-menu-item href="https://github.com/saurabhzaiswal" target="_blank" rel="noopener noreferrer">
        <mat-icon>code</mat-icon>
        GitHub
      </a>
    </mat-menu>
  </div>
</mat-toolbar>
