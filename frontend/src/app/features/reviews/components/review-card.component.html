<mat-card *ngIf="result" class="review-card" [class.review-card--error]="result.hasError">
  <div class="review-card__header">
    <div class="review-card__heading">
      <h3>AI Analysis</h3>
      <p class="review-card__theme">{{ result.theme }}</p>
    </div>
    <app-sentiment-badge [label]="result.label" [score]="result.score"></app-sentiment-badge>
  </div>

  <mat-divider></mat-divider>

  <blockquote class="review-card__quote">
    “{{ result.review }}”
  </blockquote>

  <div class="review-card__content">
    <div class="review-card__field">
      <span>Score</span>
      <strong>{{ result.score }} / 5</strong>
    </div>

    <div class="review-card__field">
      <span>Confidence</span>
      <strong>{{ (result.confidence ?? 0) | percent:'1.0-0' }}</strong>
    </div>

    <div class="review-card__field review-card__field--wide">
      <span>Suggestion</span>
      <p>{{ result.suggestion || 'No suggestion provided.' }}</p>
    </div>
  </div>
</mat-card>
