<div class="history-shell">
  <div class="history-toolbar">
    <mat-form-field appearance="outline">
      <mat-label>Search reviews</mat-label>
      <input matInput placeholder="Enter keywords" [formControl]="searchControl" (input)="applyFilters()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sentiment</mat-label>
      <mat-select [formControl]="sentimentControl" (selectionChange)="applyFilters()">
        <mat-option value="all">All</mat-option>
        <mat-option value="positive">Positive</mat-option>
        <mat-option value="neutral">Neutral</mat-option>
        <mat-option value="negative">Negative</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Theme</mat-label>
      <mat-select [formControl]="themeControl" (selectionChange)="applyFilters()">
        <mat-option value="all">All</mat-option>
        <mat-option *ngFor="let theme of availableThemes" [value]="theme">{{ theme }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <ng-container *ngIf="dataSource.data.length > 0; else emptyState">
    <table mat-table [dataSource]="dataSource" matSort class="history-table" aria-label="Review history">
      <ng-container matColumnDef="review">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Review</th>
        <td mat-cell *matCellDef="let item">{{ item.review | truncate:80 }}</td>
      </ng-container>

      <ng-container matColumnDef="sentiment">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sentiment</th>
        <td mat-cell *matCellDef="let item">
          <app-sentiment-badge [label]="item.label" [score]="item.score"></app-sentiment-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="score">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Score</th>
        <td mat-cell *matCellDef="let item">{{ item.score }}/5</td>
      </ng-container>

      <ng-container matColumnDef="theme">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Theme</th>
        <td mat-cell *matCellDef="let item">{{ item.theme }}</td>
      </ng-container>

      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created At</th>
        <td mat-cell *matCellDef="let item">{{ item.created_at | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let item">
          <button mat-icon-button color="warn" type="button" (click)="confirmDelete(item.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </ng-container>

  <ng-template #emptyState>
    <app-empty-state
      title="No history available"
      description="Analyze and save one or more reviews to see the history here."
    ></app-empty-state>
  </ng-template>
</div>
