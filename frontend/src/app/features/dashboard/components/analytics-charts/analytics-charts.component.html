<div class="analytics-charts">
  <mat-card class="analytics-card">
    <div class="analytics-card__header"><h3>{{ 'charts.sentiment' | translate }}</h3></div>
    <div class="chart-shell">
      <canvas #sentimentCanvas></canvas>
    </div>
  </mat-card>

  <mat-card class="analytics-card">
    <div class="analytics-card__header"><h3>{{ 'charts.themes' | translate }}</h3></div>
    <div class="chart-shell">
      <canvas #themeCanvas></canvas>
    </div>
  </mat-card>

  <mat-card class="analytics-card analytics-card--wide">
    <div class="analytics-card__header"><h3>{{ 'charts.trend' | translate }}</h3></div>
    <div class="chart-shell">
      <canvas #trendCanvas></canvas>
    </div>
  </mat-card>
</div>
