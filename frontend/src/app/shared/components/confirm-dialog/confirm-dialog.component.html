<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button color="warn" type="button" (click)="onConfirm()">{{ 'history.delete' | translate }}</button>
</mat-dialog-actions>
