<div class="dialog-backdrop" *ngIf="open">
  <div class="dialog-card">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="dialog-actions">
      <button type="button" (click)="cancel.emit()">Cancel</button>
      <button type="button" class="confirm" (click)="confirm.emit()">Confirm</button>
    </div>
  </div>
</div>
